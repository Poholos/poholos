[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
# `cargo run --release` flashes over the DevKitC-1's native USB-JTAG and
# tails the log output (install once: `cargo install espflash`).
runner = "espflash flash --monitor"
rustflags = ["-C", "link-arg=-Tlinkall.x"]

[env]
ESP_LOG = "info"
