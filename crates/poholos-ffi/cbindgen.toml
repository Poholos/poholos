# Header generation for the Swift/iOS embedding:
#
#     cbindgen --crate poholos-ffi --output include/poholos_ffi.h
#
# (run from this directory; `cargo install cbindgen` first). The header is
# generated on demand by the XCFramework packaging script rather than by a
# build.rs, so plain `cargo build`/`cargo test` never need cbindgen.

language = "C"
include_guard = "POHOLOS_FFI_H"
autogen_warning = "/* Generated by cbindgen from the poholos-ffi crate; do not edit by hand. */"
documentation = true
usize_is_size_t = true
cpp_compat = true

[enum]
# `PoholosStatus` -> `POHOLOS_STATUS_OK` etc.: gives the C constants a
# namespace-like prefix; Swift's Clang importer strips it back off.
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true
